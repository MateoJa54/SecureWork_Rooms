services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: securework
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d securework"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=securework
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SESSION_TOKEN_SECRET=${SESSION_TOKEN_SECRET}
      - SESSION_TOKEN_EXPIRES_MIN=15
      - CORS_ORIGIN=*
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE_MB=10
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    ports:
      - "0.0.0.0:3000:3000"
      - "0.0.0.0:9229:9229"

  frontend:
    build: ./frontend
    environment:
      - VITE_API_URL=http://${HOST_IP:-localhost}:3000/api
      - VITE_SOCKET_URL=http://${HOST_IP:-localhost}:3000
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "0.0.0.0:5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data: